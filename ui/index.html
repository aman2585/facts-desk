<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>Antar — Facts Desk</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "inverse-primary": "#96d1d6",
            "outline-variant": "#bfc8c9",
            primary: "#003336",
            surface: "#fcf9f8",
            "on-error-container": "#93000a",
            "surface-variant": "#e5e2e1",
            "on-surface": "#1c1b1b",
            error: "#ba1a1a",
            background: "#fcf9f8",
            "surface-container-high": "#eae7e7",
            "on-primary-container": "#7fbabf",
            "primary-fixed-dim": "#96d1d6",
            "surface-container-highest": "#e5e2e1",
            "on-secondary-container": "#626361",
            "surface-container-lowest": "#ffffff",
            "primary-fixed": "#b1edf2",
            secondary: "#5e5f5d",
            "surface-tint": "#2a676c",
            "on-background": "#1c1b1b",
            "surface-dim": "#dcd9d9",
            "inverse-surface": "#313030",
            "on-secondary": "#ffffff",
            "inverse-on-surface": "#f3f0ef",
            "error-container": "#ffdad6",
            "primary-container": "#004b50",
            outline: "#707979",
            "secondary-container": "#e0e0dd",
            "on-error": "#ffffff",
            "on-surface-variant": "#404849",
            "on-primary": "#ffffff",
            "surface-container-low": "#f6f3f2",
            "surface-container": "#f0eded",
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            "2xl": "1rem",
            full: "9999px",
          },
          spacing: {
            "card-padding": "16px",
            "margin-mobile": "20px",
            "stack-gap": "12px",
            unit: "4px",
            "section-gap": "32px",
          },
          fontFamily: {
            sans: ["Hanken Grotesk", "system-ui", "sans-serif"],
          },
          fontSize: {
            "display-lg": [
              "30px",
              { lineHeight: "38px", letterSpacing: "-0.02em", fontWeight: "600" },
            ],
            "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
            "label-caps": [
              "12px",
              { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" },
            ],
            "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
            "numeric-data": [
              "16px",
              { lineHeight: "24px", letterSpacing: "0.01em", fontWeight: "500" },
            ],
            "headline-md": ["20px", { lineHeight: "28px", fontWeight: "600" }],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body class="bg-background text-on-surface font-sans antialiased">
  <div id="app" class="mx-auto min-h-screen max-w-[600px] relative">
    <header
      class="fixed top-0 left-0 right-0 z-50 mx-auto max-w-[600px] bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"
    >
      <div class="h-16 px-margin-mobile flex items-center justify-between">
        <h1 class="text-headline-md text-primary tracking-tight">Antar</h1>
        <button
          id="btn-new-chat"
          type="button"
          class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors"
          aria-label="New chat"
          title="New chat"
        >
          <span class="material-symbols-outlined text-on-surface-variant">edit_square</span>
        </button>
      </div>
    </header>

    <main id="main" class="flex flex-col min-h-screen pt-16 pb-[7.5rem] bg-background">
      <!-- Welcome -->
      <section id="welcome" class="flex flex-col w-full px-margin-mobile pt-12">
        <div class="flex flex-col gap-6 mb-12">
          <div
            class="w-12 h-12 rounded-full bg-primary flex items-center justify-center"
          >
            <span class="material-symbols-outlined text-on-primary text-[24px]"
              >smart_toy</span
            >
          </div>
          <h2 class="text-display-lg text-on-surface">
            Hello.<br />How can I help you with mutual fund facts today?
          </h2>
        </div>
        <div class="flex flex-col gap-unit">
          <p
            class="text-label-caps text-on-surface-variant uppercase tracking-widest opacity-60 mb-2 pl-2"
          >
            Try asking
          </p>
          <div id="example-chips" class="flex flex-col gap-unit"></div>
        </div>
      </section>

      <!-- Thread -->
      <section
        id="thread"
        class="hidden flex flex-col w-full px-margin-mobile gap-stack-gap pt-4"
        aria-live="polite"
      ></section>
    </main>

    <nav
      class="fixed bottom-0 left-0 right-0 z-50 mx-auto max-w-[600px] bg-surface/90 backdrop-blur-xl pb-safe shadow-[0_-1px_8px_rgba(0,0,0,0.04)]"
    >
      <div class="px-margin-mobile py-unit flex flex-col gap-unit">
        <form id="ask-form" class="flex items-center bg-white border border-outline-variant rounded-xl px-4 h-12 gap-3">
          <label for="ask-input" class="sr-only">Ask a question</label>
          <input
            id="ask-input"
            class="flex-1 bg-transparent border-none outline-none text-body-lg text-on-surface placeholder:text-on-surface-variant/50"
            placeholder="Ask about mutual funds..."
            type="text"
            autocomplete="off"
            maxlength="4000"
          />
          <button
            id="btn-send"
            type="submit"
            class="text-primary flex items-center justify-center h-8 w-8 disabled:opacity-40"
            aria-label="Send"
          >
            <span class="material-symbols-outlined">send</span>
          </button>
        </form>
        <div class="flex justify-center items-center h-8">
          <p
            class="text-label-caps text-on-surface-variant uppercase tracking-widest opacity-60 text-center"
          >
            Facts-only. No investment advice.
          </p>
        </div>
      </div>
    </nav>
  </div>

  <script src="./assets/app.js" type="module"></script>
</body>
</html>
